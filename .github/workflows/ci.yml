name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Unit tests (no DB)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q --tb=short
