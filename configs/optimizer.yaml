lambda:
  wait: 10.0
  overload: 1.0
  balance: 0.1

resources:
  n_beds: 20
  n_isolation_beds: 4
  n_ventilators: 8

rolling:
  step_hours: 2

policy:
  default: cp_sat   # cp_sat | ppo | hybrid

# Wave1: calib tunes params; eval is report-only (do NOT retune on eval)
eval_split:
  calib_ratio: 0.7
  seed: 42

solver:
  max_time_seconds: 180
  candidate_cap: 1000   # top-N stays by priority for P0 CP-SAT
