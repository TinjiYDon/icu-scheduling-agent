lambda:
  wait: 10.0
  overload: 1.0
  balance: 0.1
  zone_mismatch: 0.5
  move: 0.5   # 挪床惩罚：已有患者换床的惩罚权重（滚动重优化时保持稳定）
resources:
  n_beds: 30
  n_isolation_beds: 4
  n_ventilators: 8
  max_patients: 200
  bed_zones:
  - - 1
    - 4
    - ISO
  - - 5
    - 4
    - MICU
  - - 9
    - 4
    - SICU
  - - 13
    - 4
    - CCU
  - - 17
    - 4
    - NICU
rolling:
  step_hours: 2
eval_split:
  calib_ratio: 0.7
  seed: 42
policy:
  default: cp_sat
ppo:
  candidate_patients: 20
  training_pool_patients: 200
  invalid_action_penalty: 10.0
  wait_action_penalty: 1.0
  seed: 42
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  batch_size: 64
  n_steps: 256
  total_timesteps: 200000
  model_path: artifacts/ppo_icu
solver:
  candidate_cap: 1000
  max_time_seconds: 180
