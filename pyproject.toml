[project]
name = "icu-scheduling"
version = "0.1.0"
description = "ICU resource dynamic scheduling agent (CP-SAT core)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "polars>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "ortools>=9.10",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["infra*", "data_access*", "domain*", "application*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: rewrites staging tables from Layer0/mock (~minutes); run with `pytest -m slow`",
]
